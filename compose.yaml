services:
  mongodb:
    image: mongo:7.0.16
    container_name: routeflow-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - routeflow-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  routeflow-data:
